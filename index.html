<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Game Stash</title>
    <style>
      body {
        overflow: hidden;
        background: #000000;
        margin: 0;
        padding: 0;
        color: #000000;
      }

      #startButton {
        display: block;
        width: 160px;
        height: 40px;
        background-color: #4caf50;
        color: white;
        text-align: center;
        text-decoration: none;
        font-size: 16px;
        margin: 20px auto;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: "Press Start 2P", cursive;
        box-shadow: 0px 0px 10px 2px #000000;
      }
      
      #game {
        width: 100vw;
        height: 100vh;
      }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet" />
  </head>

  <body>
    <div style="width: 100vw; height: 100vh; max-width: 100%">
      <div id="game" style="display: none"></div>
      <button id="startButton">PLAY</button>
    </div>

    <script>
      function startGame() {
        document.getElementById("game").style.display = "block";
        document.getElementById("startButton").style.display = "none";
        
        // EmulatorJS Configurations
        window.EJS_player = "#game";
        window.EJS_core = "parallel_n64";
        window.EJS_color = "#000000";
        window.EJS_startOnLoaded = true;
        
        // Using stable, official EmulatorJS CDN for the core data
        window.EJS_pathtodata = "https://emulatorjs.org";
        
        // POINT THIS TO YOUR LOCAL REPOSITORY ROM FILE
        window.EJS_gameUrl = "./game.7z"; 
        
        window.EJS_defaultOptions = {
          vsync: "disabled",
        };
        
        loadGame();
      }

      document.getElementById("startButton").addEventListener("click", startGame);

      function loadGame() {
        // Load official stable EmulatorJS loader script
        var script = document.createElement("script");
        script.src = "https://emulatorjs.orgloader.js";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
